<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fa-Mitra · Dashboard keuangan</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#F3F1F0;--bg2:#F3F1F0;--card:#fff;--solid:#fff;--ink:#262322;--mute:#6E6766;--line:rgba(38,35,34,.09);--acc:#D03437;--acc2:#F8DCDC;--pos:#14683F;--posbg:#DDF3E7;--neg:#363533;--negbg:#ECE9E8;--nav:#363533;--navfg:#fff;--hero1:#C8262B;--hero2:#DB3A3E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 38%,var(--bg2) 100%) fixed;color:var(--ink);font:14px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{max-width:430px;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid var(--solid)}
.top .who{flex:1;min-width:0}.who small{display:block;color:var(--mute);font-size:12px}.who b{font-size:16px;font-weight:700}
.ib{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;position:relative}
.ib i{position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:#E5484D}
svg{display:block}.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero{border-radius:28px;padding:6px;background:#fff!important;border:1px solid #EAE5E4;box-shadow:0 10px 30px rgba(200,38,43,.12)}
.hero .in{border-radius:23px;padding:18px 18px 16px;color:#fff;background:linear-gradient(135deg,var(--hero1),var(--hero2))}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;background:rgba(255,255,255,.28);font-size:12px;font-weight:600}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:10px 0 12px;line-height:1.1}
.split{display:flex;gap:3px;height:8px;margin-bottom:6px}.split span{border-radius:4px}
.legend{display:flex;justify-content:space-between;font-size:12px;margin-bottom:14px;opacity:.95}
.acts{display:flex;gap:8px}.acts button{flex:1;height:44px;border-radius:22px;background:rgba(255,255,255,.92);color:#4A1416;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.foot{padding:10px 8px 6px;text-align:center;font-size:11px;letter-spacing:.04em;color:#6E6766}
h2{font-size:16px;font-weight:700;margin:0}.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 10px}
.link{color:var(--mute);font-size:12px;font-weight:600;min-height:44px;padding:0 4px}
.scroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.card{background:var(--card);border-radius:22px;padding:14px;box-shadow:0 1px 3px rgba(38,35,34,.06)}
.mini{flex:0 0 150px}.mini .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;margin-bottom:10px}
.mini small{color:var(--mute);font-size:12px;display:block}.mini b{font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:4px}.lg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.net{font-size:19px;font-weight:800;color:var(--pos);text-align:right;line-height:1.2}.net small{display:block;font-size:11px;font-weight:500;color:var(--mute)}
.rd{display:flex;justify-content:space-between;gap:8px;margin-top:8px;padding:10px 12px;border-radius:14px;background:#F3F1F0;font-size:12px}.rd b{font-weight:700}
.don{display:flex;align-items:center;gap:18px}.don svg{flex:none}.don ul{list-style:none;margin:0;padding:0;flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;font-size:13px}.don li{display:flex;align-items:center;gap:8px}.don li i{width:10px;height:10px;border-radius:3px;flex:none}.don li b{margin-left:auto}
.stat small{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:12px}.stat b{display:block;font-size:17px;margin-top:6px}.stat em{font-style:normal;font-size:11px;color:var(--mute)}
.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.tx:first-child{border-top:0}
.tx .dot{flex:0 0 40px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.tx div{flex:1;min-width:0}.tx b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tx small{color:var(--mute);font-size:12px}
.tx .a{flex:none;text-align:right}.tx .a b{font-weight:700;overflow:visible}
.in-dot{background:var(--posbg);color:var(--pos)}.out-dot{background:var(--negbg);color:var(--neg)}
h1{font-size:22px;font-weight:800;margin:6px 4px 16px;letter-spacing:-.01em}
.field{background:var(--card);border-radius:22px;padding:14px 16px;position:relative}
.field label{font-size:12px;color:var(--mute);font-weight:600;display:block}
.field select{width:100%;margin-top:6px;border:0;background:transparent;font:700 18px "Plus Jakarta Sans",sans-serif;color:var(--ink);appearance:none;min-height:36px}
.field+.field{margin-top:10px}
.flip{position:absolute;left:50%;transform:translate(-50%,-50%);z-index:2;width:44px;height:44px;border-radius:50%;background:var(--nav);color:#fff;display:grid;place-items:center;border:4px solid var(--bg2)}
.flipwrap{position:relative;height:0}
.amt{display:flex;align-items:center;gap:8px;background:#F3F1F0;border-radius:18px;padding:0 16px;height:56px;margin-top:8px}
.amt span{color:var(--mute);font-weight:600}.amt input{flex:1;min-width:0;border:0;background:none;font:800 22px "Plus Jakarta Sans",sans-serif;color:var(--ink);text-align:right}
.seg{display:flex;padding:4px;gap:4px;background:var(--acc2);border-radius:18px;margin-bottom:12px}
.seg button{flex:1;height:40px;border-radius:14px;font-weight:600;font-size:13px;color:var(--mute)}.seg button[aria-pressed=true]{background:var(--solid);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hint{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;margin:12px 4px 18px}
.swipe{position:relative;height:56px;border-radius:28px;background:var(--acc);color:#fff;font-weight:700;display:grid;place-items:center;touch-action:none;user-select:none;overflow:hidden}
.knob{position:absolute;left:4px;top:4px;width:48px;height:48px;border-radius:50%;background:#fff;color:var(--acc);display:grid;place-items:center;touch-action:none}
.swipe.bad{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pts{border-radius:28px;padding:6px;background:var(--card)}.pts .in{border-radius:23px;padding:16px 18px;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff}
.pts .big{margin:6px 0 2px}.pts small{opacity:.9}
.claim{display:flex;flex-direction:column;gap:4px;padding:14px 0;border-top:1px solid var(--line)}.claim:first-of-type{border-top:0}
.claim .r{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{height:44px;padding:0 16px;border-radius:22px;background:var(--acc);color:#fff;font-weight:600;font-size:13px;flex:none}
.empty{padding:18px 0;text-align:center;color:var(--mute)}
.bar{margin-bottom:14px}.bar .row{font-size:13px;margin-bottom:6px}.bar .t{height:8px;border-radius:4px;background:var(--acc2);overflow:hidden}.bar .t i{display:block;height:100%;border-radius:4px;background:var(--acc)}
.bar span.s{color:var(--mute);margin-left:8px}
nav{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
nav .p{width:100%;max-width:402px;background:var(--nav);border-radius:32px;padding:6px;display:flex;gap:2px;box-shadow:0 10px 30px rgba(40,15,15,.3)}
nav button{flex:1;height:48px;border-radius:24px;color:#D6CFCD;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px;min-width:48px}
nav button[aria-current=page]{flex:2.2;background:#fff;color:#0B0A0E}
nav button span{display:none}nav button[aria-current=page] span{display:inline}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg2);padding:10px 16px;border-radius:20px;font-weight:600;font-size:13px;z-index:9;transition:opacity .3s}
@media (prefers-reduced-motion:reduce){.swipe.bad{animation:none}.toast{transition:none}}

return`<svg id="fl" viewBox="0 0 340 168" style="width:100%;touch-action:pan-y;cursor:crosshair" role="img" aria-label="Grafik arus kas 30 hari: uang masuk lebih tinggi dari uang keluar hampir sepanjang periode"><defs><linearGradient id="gi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E7B4F" stop-opacity=".30"/><stop offset="1" stop-color="#1E7B4F" stop-opacity="0"/></linearGradient></defs>${[0,1,2].map(v=>`<line x1="16" x2="324" y1="${fy(v)}" y2="${fy(v)}" stroke="#EAE5E4" ${v?'stroke-dasharray="2 4"':''}/>`).join('')}<path d="${pi}L${fx(14)},136L${fx(0)},136Z" fill="url(#gi)"/><path d="${sm(COUT)}" fill="none" stroke="#363533" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"/><path d="${pi}" fill="none" stroke="#1E7B4F" stroke-width="3" stroke-linecap="round"/><line id="flv" y1="8" y2="136" stroke="#363533" stroke-dasharray="3 3"/><circle id="fc1" r="5" fill="#1E7B4F" stroke="#fff" stroke-width="2"/><circle id="fc2" r="5" fill="#363533" stroke="#fff" stroke-width="2"/>${[0,4,8,12].map(i=>`<text x="${fx(i)}" y="156" font-size="10" fill="#6E6766" text-anchor="middle">${dl(i)}</text>`).join('')}</svg>`}
function setFlow(k){const a=$('#flv');if(!a)return;a.setAttribute('x1',fx(k));a.setAttribute('x2',fx(k));const c=$('#fc1'),d=$('#fc2');c.setAttribute('cx',fx(k));c.setAttribute('cy',fy(CIN[k]));d.setAttribute('cx',fx(k));d.setAttribute('cy',fy(COUT[k]));$('#flr').innerHTML=`<b>${dl(k)}</b><span style="color:var(--pos)">Masuk ${jt(CIN[k])}</span><span>Keluar ${jt(COUT[k])}</span>`}
function donut(){const tot=INC.reduce((a,b)=>a+b[1],0),C=['#D03437','#363533','#EE8F8B','#A9A3A1','#F4CFCD'],L=2*Math.PI*42;let o=0;const sg=INC.map(([n,v],i)=>{const l=v/tot*L,s=Math.max(l-3,0);const e=`<circle cx="60" cy="60" r="42" fill="none" stroke="${C[i]}" stroke-width="16" stroke-dasharray="${s} ${L-s}" stroke-dashoffset="${-o}" transform="rotate(-90 60 60)"/>`;o+=l;return e}).join('');
return`<div class="don"><svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Komposisi pemasukan per unit layanan">${sg}<text x="60" y="58" text-anchor="middle" font-size="15" font-weight="800" fill="#262322">${S.hide?'••••':jt(tot/1e6)}</text><text x="60" y="74" text-anchor="middle" font-size="10" fill="#6E6766">pemasukan</text></svg><ul>${INC.map(([n,v],i)=>`<li><i style="background:${C[i]}"></i>${n}<b>${Math.round(v/tot*100)}%</b></li>`).join('')}</ul></div>`}
function home(){const tot=S.cash+S.bank,cp=S.cash/tot*100;return`
<div class="top"><img src="${LOGO}" alt="Logo Klinik Fa-Mitra"><div class="who"><small>Selamat datang kembali</small><b>Administrator</b></div><button class="ib" aria-label="Notifikasi">${ic('bell')}<i></i></button><button class="ib" aria-label="Pengaturan">${ic('cog')}</button></div>
<div class="hero"><div class="in"><div class="row"><span style="font-size:13px;font-weight:600">Total dana klinik</span><span class="row" style="gap:6px"><button class="chip" id="eye" aria-label="${S.hide?'Tampilkan':'Sembunyikan'} saldo" style="width:34px;padding:0;justify-content:center">${ic(S.hide?'eyeoff':'eye')}</button><button class="chip" id="per">${S.per} ${ic('chev')}</button></span></div>
<div class="big">${mask(rp(tot))}</div>
<div class="split" role="img" aria-label="Kas tunai ${Math.round(cp)} persen, rekening ${100-Math.round(cp)} persen"><span style="flex:${cp};background:#fff"></span><span style="flex:${100-cp};background:rgba(255,255,255,.45)"></span></div>
<div class="legend"><span>Kas tunai ${mask(rp(S.cash))}</span><span>Rekening ${mask(rp(S.bank))}</span></div>
<div class="acts"><button data-go="add">${ic('plus')}Catat</button><button data-go="bill">${ic('bill')}Tagihan</button><button data-go="rep">${ic('chart')}Laporan</button></div></div>
<div class="foot">2 NOV 2026 | DIPERBARUI 07.07</div></div>
<div class="sec"><h2>Ringkasan ${S.per.toLowerCase()}</h2></div>
<div class="two"><div class="card stat"><small><span class="dot in-dot" style="width:24px;height:24px;border-radius:50%;display:grid;place-items:center">${ic('down')}</span>Pemasukan</small><b style="color:var(--pos)">${mask(rp(S.inc))}</b><em>sudah diterima</em></div>
<div class="card stat"><small><span class="dot out-dot" style="width:24px;height:24px;border-radius:50%;display:grid;place-items:center">${ic('up')}</span>Pengeluaran</small><b>${mask(rp(S.exp))}</b><em>9 transaksi keluar</em></div></div>
<div class="sec"><h2>Arus kas 30 hari</h2></div>
<div class="card"><div class="row" style="align-items:flex-start"><div><div class="lg"><span><i style="background:#1E7B4F"></i>Masuk</span><span><i style="background:#363533"></i>Keluar</span></div></div><div class="net"><small>Selisih bersih</small>${S.hide?'Rp••••':'+'+jt(CIN.reduce((a,b)=>a+b,0)-COUT.reduce((a,b)=>a+b,0))}</div></div>${flowChart()}<div class="rd" id="flr" aria-live="polite"></div></div>
<div class="sec"><h2>Sumber pemasukan</h2><span class="link" style="display:grid;place-items:center">Bulan ini</span></div>
<div class="card">${donut()}</div>
<div class="sec"><h2>Transaksi terakhir</h2><button class="link" data-go="add">Catat baru</button></div>
<div class="card">${S.tx.slice(0,5).map(txRow).join('')}</div>`}
function add(){const o=S.mode==='in'?INC:EXP;return`<h1>Catat transaksi</h1>
<div class="seg" role="group" aria-label="Jenis"><button data-m="in" aria-pressed="${S.mode==='in'}">Uang masuk</button><button data-m="out" aria-pressed="${S.mode==='out'}">Uang keluar</button></div>
<div class="field"><label for="u">${S.mode==='in'?'Dari unit layanan':'Untuk kategori'}</label><select id="u">${o.map(x=>`<option>${x[0]}</option>`).join('')}</select></div>
<div class="flipwrap"><div class="flip" aria-hidden="true">${ic('ud')}</div></div>
<div class="field"><label for="mt">${S.mode==='in'?'Diterima lewat':'Dibayar lewat'}</label><select id="mt"><option>Tunai</option><option>QRIS</option><option>Transfer BCA</option></select></div>
<div class="field" style="margin-top:10px"><label for="am">Jumlah</label><div class="amt"><span>Rp</span><input id="am" inputmode="numeric" placeholder="0" autocomplete="off"></div></div>
<div class="hint"><span>Saldo kas tunai</span><b>${rp(S.cash)}</b></div>
<div class="swipe" id="sw"><span id="swt">Geser untuk simpan</span><button class="knob" id="kn" aria-label="Simpan transaksi">${ic('right')}</button></div>`}
function bill(){const c=S.claims;return`<h1>Tagihan &amp; klaim</h1>
<div class="pts"><div class="in"><small>Piutang belum cair</small><div class="big">${mask(rp(S.piutang))}</div><small>${c.length} item perlu ditindaklanjuti</small></div><div class="foot" style="padding:10px">Margin 71% termasuk piutang</div></div>
<div class="sec"><h2>Perlu ditindaklanjuti</h2></div>
<div class="card">${c.length?c.map(x=>`<div class="claim"><b>${x.t}</b><small style="color:var(--mute);font-size:12px">${x.m}</small><div class="r"><b style="font-size:16px">${rp(x.a)}</b><button class="btn" data-c="${x.id}">${x.b}</button></div></div>`).join(''):'<div class="empty">Semua tagihan sudah beres</div>'}</div>`}
function rep(){const W=340,H=150,mx=2,x=i=>20+i*(W-30)/14,y=v=>H-10-v/mx*(H-30),pl=a=>a.map((v,i)=>x(i)+','+y(v)).join(' '),k=S.pick??13;return`<h1>Laporan</h1>
<div class="card"><div class="row" style="margin-bottom:6px"><div><h2>Arus kas 30 hari</h2><small style="color:var(--mute)">Ketuk grafik untuk melihat per dua hari</small></div></div>
<svg id="ch" viewBox="0 0 ${W} ${H+20}" style="width:100%;touch-action:none" role="img" aria-label="Grafik arus kas: pemasukan lebih tinggi dari pengeluaran hampir sepanjang periode">
${[0,.5,1,1.5,2].map(v=>`<line x1="20" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>`).join('')}
<polyline fill="none" stroke="var(--mute)" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round" points="${pl(COUT)}"/>
<polyline fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${pl(CIN)}"/>
<line x1="${x(k)}" x2="${x(k)}" y1="6" y2="${H-10}" stroke="var(--ink)" stroke-dasharray="3 3"/><circle cx="${x(k)}" cy="${y(CIN[k])}" r="5" fill="var(--acc)" stroke="var(--solid)" stroke-width="2"/><circle cx="${x(k)}" cy="${y(COUT[k])}" r="5" fill="var(--mute)" stroke="var(--solid)" stroke-width="2"/>
${[[0,'4 Okt'],[4,'12 Okt'],[8,'20 Okt'],[12,'28 Okt']].map(([i,l])=>`<text x="${x(i)}" y="${H+8}" font-size="10" fill="var(--mute)" text-anchor="middle">${l}</text>`).join('')}</svg>
<div class="row" style="font-size:13px;margin-top:6px"><b>${4+k*2>31?(4+k*2-31)+' Nov':(4+k*2)+' Okt'}</b><span style="color:var(--pos)">Masuk ${CIN[k].toFixed(1).replace('.',',')} jt</span><span>Keluar ${COUT[k].toFixed(1).replace('.',',')} jt</span></div></div>
<div class="sec"><h2>Pemasukan per unit</h2></div><div class="card" style="padding-bottom:2px">${bars(INC,27850000)}</div>
<div class="sec"><h2>Pengeluaran per kategori</h2></div><div class="card" style="padding-bottom:2px">${bars(EXP,14320000)}</div>`}
function navb(){const T=[['home','Beranda','home'],['add','Catat','swap'],['bill','Tagihan','bill'],['rep','Laporan','chart']];return`<nav aria-label="Menu utama"><div class="p">${T.map(([k,l,i])=>`<button data-go="${k}" aria-label="${l}" ${S.tab===k?'aria-current="page"':''}>${ic(i)}<span>${l}</span></button>`).join('')}</div></nav>`}
function render(){$('#app').innerHTML=({home,add,bill,rep})[S.tab]()+navb();bind()}
function go(t){S.tab=t;S.pick=null;render();scrollTo(0,0)}
function save(){const am=parseInt(($('#am').value||'').replace(/\D/g,''))||0;if(!am)return false;const i=S.mode==='in',m=$('#mt').value,u=$('#u').value;
if(m==='Tunai')S.cash+=i?am:-am;else S.bank+=i?am:-am;i?S.inc+=am:S.exp+=am;S.tx.unshift([i?1:0,(i?'Pemasukan · ':'Pengeluaran · ')+u,u+' · Baru saja',m,am]);toast('Transaksi tersimpan');go('home');return true}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
const e=$('#eye');if(e)e.onclick=()=>{S.hide=!S.hide;render()};
const fl=$('#fl');if(fl){setFlow(13);const mv=ev=>{const r=fl.getBoundingClientRect();setFlow(Math.max(0,Math.min(14,Math.round(((ev.clientX-r.left)/r.width*340-16)/(308/14)))))};fl.onpointerdown=mv;fl.onpointermove=mv}
const p=$('#per');if(p)p.onclick=()=>{const L=['Bulan ini','Hari ini'];S.per=L[(L.indexOf(S.per)+1)%2];if(S.per==='Hari ini'){S.inc=550000;S.exp=1250000}else{S.inc=27850000;S.exp=14320000}render()};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;render()});
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const x=S.claims.find(c=>c.id==b.dataset.c);S.claims=S.claims.filter(c=>c!==x);S.piutang-=x.a;S[x.to]+=x.a;S.inc+=x.a;toast('Dicatat: '+rp(x.a));render()});
const am=$('#am');if(am)am.oninput=()=>{const n=am.value.replace(/\D/g,'');am.value=n?(+n).toLocaleString('id-ID'):''};
const kn=$('#kn');if(kn){const sw=$('#sw');let sx=null,max;const fail=()=>{sw.classList.remove('bad');void sw.offsetWidth;sw.classList.add('bad');am.focus()};
const done=()=>{if(!save()){fail();kn.style.transform='';$('#swt').style.opacity=1}};
kn.onpointerdown=e=>{sx=e.clientX;max=sw.clientWidth-56;kn.setPointerCapture(e.pointerId)};
kn.onpointermove=e=>{if(sx===null)return;const d=Math.max(0,Math.min(max,e.clientX-sx));kn.style.transform=`translateX(${d}px)`;$('#swt').style.opacity=1-d/max};
kn.onpointerup=e=>{if(sx===null)return;const d=e.clientX-sx;sx=null;if(d>max*.8)done();else{kn.style.transform='';$('#swt').style.opacity=1}};
kn.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();done()}}}
const ch=$('#ch');if(ch)ch.onpointerdown=ch.onpointermove=e=>{if(e.type==='pointermove'&&!e.buttons)return;const r=ch.getBoundingClientRect(),vx=(e.clientX-r.left)/r.width*340;S.pick=Math.max(0,Math.min(14,Math.round((vx-20)/(310/14))));const y=scrollY;render();scrollTo(0,y)}}
render();
</script></body></html>
